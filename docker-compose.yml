services:
  postgres:
    image: postgres:16-alpine
    container_name: Auto-ML-Postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-automl}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-automl_dev_pw}
      POSTGRES_DB: ${POSTGRES_DB:-automl}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-automl} -d ${POSTGRES_DB:-automl}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - automl-net

  redis:
    image: redis:7-alpine
    container_name: Auto-ML-Redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - automl-net

  minio:
    image: minio/minio:latest
    container_name: Auto-ML-MinIO
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-automl}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-automl_dev_pw}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - automl-net

  minio-init:
    image: minio/mc:latest
    container_name: Auto-ML-MinIO-Init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-automl}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-automl_dev_pw}
      MINIO_SCRIPTS_BUCKET: ${MINIO_SCRIPTS_BUCKET:-scripts}
      MINIO_MODELS_BUCKET: ${MINIO_MODELS_BUCKET:-models}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb -p local/$$MINIO_SCRIPTS_BUCKET &&
      mc mb -p local/$$MINIO_MODELS_BUCKET &&
      exit 0
      "
    networks:
      - automl-net

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  automl-net:
    name: automl-net
    driver: bridge
